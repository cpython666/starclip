[package]
name = "starclip"
version = "0.2.3"
description = "星笺 Starclip — a local-first clipboard manager"
authors = ["Starclip contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "starclip_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "starclip"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:arboard", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-dialog", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:windows-sys", "dep:tauri-plugin-updater", "dep:tauri-plugin-autostart", "dep:plist", "dep:windows-registry", "dep:sys-locale"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
fontdue = "0.9"
rustybuzz = "0.20"
unicode-linebreak = "0.1"
unicode-segmentation = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
getrandom = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"], optional = true }
arboard = { version = "3.6", default-features = false, features = ["image-data"], optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2.7", optional = true }
sys-locale = { version = "0.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSRunningApplication", "NSWorkspace"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"], optional = true }
plist = { version = "1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"], optional = true }
windows-registry = { version = "0.6", optional = true }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
