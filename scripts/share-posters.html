<body><main id="poster"></main>
<script type="module">
import {createApp, h} from 'vue';
import StarPet from '/src/components/StarPet.vue';

const requested = new URLSearchParams(location.search).get('id') || 'overview';
const english = requested.endsWith('-en');
const id = english ? requested.slice(0, -3) : requested;
if (!['overview', 'workflow', 'companion', 'creation', 'ai'].includes(id)) throw new Error('Unknown poster ID');
const pick = (zh, en) => english ? en : zh;
document.documentElement.lang = english ? 'en-US' : 'zh-CN';
document.title = pick('星笺 · 分享图排版源', 'Starclip · Product poster source');
const top = `<div class="brand"><img src="/starclip.svg" alt=""><div><strong>${pick('星笺 Starclip', 'Starclip')}</strong><small>${pick('本地剪贴板管理工具', 'A local-first clipboard manager')}</small></div><span class="pill">${pick('开源 · 本地优先', 'Open source · Local first')}</span></div>`;
const footer = hint => `<footer class="footer"><div><strong>github.com/cpython666/starclip</strong><p>${hint}<br>${pick('功能与平台支持以对应版本的项目说明为准', 'See the project documentation for features and platform support.')}</p></div><div class="mark">✦</div></footer>`;
const features = list => '<section class="features">' + list.map((x, i) => `<div><small>0${i + 1}</small><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('') + '</section>';
const heading = (eyebrow, title, subtitle) => `<div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p>`;
const poster = document.querySelector('#poster');
poster.className = id + (english ? ' en' : '');

if (id === 'overview') {
  poster.innerHTML = top + heading(
    pick('macOS 安装包约 7 MB · 收好每一次复制', 'macOS INSTALLER ≈ 7 MB · KEEP EVERY SPARK'),
    pick('你的剪贴板，<br><em>不止记住上一次。</em>', 'Your clipboard.<br><em>Beyond the last copy.</em>'),
    pick('复制过的文字、图片和代码，一搜就能再次复制。', 'Find the text, images and code you copied.<br>Copy them again whenever you need them.')
  ) + `<div class="mock"><div class="mockbar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><b>${pick('星笺 · 剪贴板历史', 'STARCLIP · CLIPBOARD HISTORY')}</b></div><div class="workspace"><div class="sidebar"><strong>${pick('剪贴板历史', 'Clipboard history')}</strong><div class="chosen">${pick('全部记录', 'All clips')}</div><div>✦ ${pick('星标收藏', 'Starred')}</div><div>⌘ ${pick('星码集', 'Starcode')}</div><div>${pick('工作资料', 'Work notes')}</div><div>${pick('常用片段', 'Useful snippets')}</div></div><div class="samples"><h2>${pick('刚刚复制的内容，都在这里', 'Keep your ideas within reach')}</h2><div class="search">⌕ ${pick('搜索文字、标题或代码…', 'Search text, titles or code…')}</div><div class="samplegrid"><article class="sample"><label>${pick('文字 · 刚刚', 'TEXT · JUST NOW')}</label><h3>${pick('周五灵感讨论', 'Friday idea session')}</h3><p>${pick('时间：下午 3 点<br>主题：一起做个小工具', 'Time: 3 pm<br>Let’s make a small tool.')}</p><span class="copy-chip">${pick('再次复制 ↗', 'Copy again ↗')}</span></article><article class="sample"><label>${pick('代码 · JAVASCRIPT', 'CODE · JAVASCRIPT')}</label><h3>${pick('常用代码片段', 'A useful snippet')}</h3><code>const idea =<br>  'Hello, star!';</code><span class="copy-chip">✦ ${pick('星标收藏', 'Star this clip')}</span></article></div></div></div><div class="sample-ribbon">${pick('功能示意 · 原创样例', 'Illustration · Original sample content')}</div></div>` + features(pick(
    [['找回复制历史', '搜索后再次复制<br>少一次反复查找'], ['收好重要内容', '星标、分组与代码收藏<br>需要的内容永久保留'], ['数据由你管理', '本地保存，JSON 导出<br>无需账户，按需开启']],
    [['Find earlier copies', 'Search your history.<br>Copy what you need again.'], ['Keep what matters', 'Star, group and save code.<br>Keep important clips forever.'], ['Your data, your choice', 'Local storage and JSON export.<br>No account required.']]
  )) + `<p class="size-note">${pick('macOS 安装包参考约 7 MB · 完整字体按需下载 · 实际大小随版本变化', 'macOS installer ≈ 7 MB as a reference · Fonts download as needed · Size varies by release')}</p>` + footer(pick('首次使用默认暂停记录，由你决定何时开启', 'Recording starts paused. Turn it on when you are ready.'));
}

if (id === 'workflow') {
  poster.innerHTML = top + heading(
    pick('本地数据 · 自主备份与迁移', 'LOCAL DATA · BACKUP · MIGRATION'),
    pick('剪贴板数据，<br><em>由你自己掌控。</em>', 'Your clipboard data.<br><em>Yours to manage.</em>'),
    pick('记录留在本机，导入、导出和存储位置由你决定。', 'Keep history on your computer.<br>Choose when to export it and where to store it.')
  ) + `<div class="data-scene"><div class="local-data"><span class="data-icon">▤</span><div><small>${pick('存储在你的电脑', 'ON YOUR COMPUTER')}</small><h2>${pick('我的剪贴板资料库', 'My clipboard library')}</h2><p>${pick('文字 · 图片 · 代码 · 分组', 'Text · Images · Code · Groups')}</p></div><b>${pick('本地保存', 'Local storage')}</b></div><div class="data-route"><span>↓ ${pick('导出 JSON 备份', 'Export a JSON backup')}</span><span>↑ ${pick('导入并合并记录', 'Import and merge clips')}</span></div><div class="backup-file"><span>{ }</span><div><strong>starclip-backup.json</strong><p>${pick('记录、分组与图片 · 开放的 JSON 格式', 'Clips, groups and images · An open JSON format')}</p></div></div><div class="data-options"><div><small>${pick('存到哪里', 'CHOOSE A LOCATION')}</small><strong>${pick('选择数据目录', 'Choose your data folder')}</strong></div><div><small>${pick('保留一个完整时刻', 'KEEP A COMPLETE SNAPSHOT')}</small><strong>${pick('创建与恢复完整恢复点', 'Create full restore points')}</strong></div></div><p class="data-note">${pick('普通历史 JSON 不含应用偏好；星伴成长可单独导出存档。', 'History JSON excludes app preferences. StarPet growth has a separate save export.')}</p></div>` + features(pick(
    [['随时备份', '导出自己的记录<br>保存一份本地副本'], ['继续使用', 'JSON 导入合并<br>已有记录保留'], ['自主选择', '查看并更换数据目录<br>恢复点保留完整状态']],
    [['Make a backup', 'Export your own clips.<br>Keep a local copy.'], ['Pick up again', 'Merge clips from JSON.<br>Keep existing records.'], ['Choose where', 'Move your data folder.<br>Restore a complete snapshot.']]
  )) + footer(pick('无需账户 · 无云端同步 · 数据与备份为本机明文', 'No account · No cloud sync · Local data and backups are unencrypted'));
}

if (id === 'companion') {
  poster.innerHTML = top + heading(
    pick('剪贴板管理工具里的原创星伴', 'AN ORIGINAL COMPANION FOR YOUR DESKTOP'),
    pick('管理剪贴板，<br><em>也有星芽陪你。</em>', 'A clipboard manager.<br><em>A little company, too.</em>'),
    pick('复制、收藏、创作之余，和桌面上的星芽打个招呼。', 'Between saving clips and making things,<br>say hello to your desktop StarPet.')
  ) + `<div class="pet-scene"><div class="pet-globe"></div><div class="pet" id="pet"></div><span class="pet-star">✧</span><span class="tag t1">${pick('今天也来打个招呼', 'A little hello for today')}</span><span class="tag t2">${pick('换上喜欢的小装扮', 'Dress up your way')}</span><span class="tag t3">${pick('摸摸、击掌、伸懒腰', 'Pat, high-five and stretch')}</span></div>` + features(pick(
    [['一点点成长', '日常任务积累经验<br>每份小努力都有回应'], ['穿出你的喜欢', '眼镜、披风与小玩具<br>解锁成就和新装饰'], ['按自己的节奏', '成长可随时暂停<br>离线不掉级，无断签惩罚']],
    [['Grow a little', 'Earn experience from daily tasks.<br>Enjoy small moments of progress.'], ['Make it yours', 'Glasses, capes and little toys.<br>Unlock achievements and outfits.'], ['At your own pace', 'Pause growth anytime.<br>No missed-day penalties.']]
  )) + footer(pick('原创星芽 · 装扮展示 · 默认关闭，按需开启', 'Original StarPet · Outfit illustration · Off by default, entirely optional'));
  createApp({render: () => h(StarPet, {size: 500, animated: false, mood: 'happy', equipment: {back: 'night-cape', face: 'moon-glasses', hand: 'orbit-ball', charm: 'heart-sticker'}})}).mount('#pet');
}

if (id === 'creation') {
  poster.innerHTML = top + heading(
    pick('星绘坊 · 把灵感做成图片', 'STARDRAW · TURN IDEAS INTO IMAGES'),
    pick('代码有星光，<br><em>文字有温度。</em>', 'Code with starlight.<br><em>Words with warmth.</em>'),
    pick('星码卡分享代码，月光笺留下手写般的文字。', 'Share code as a Starcode Card.<br>Give your words a handwritten feel with a Moonlight Note.')
  ) + `<div class="creation-scene"><article class="creation-card code-card"><div class="card-kind">✦ ${pick('星码卡 · 代码分享图片', 'STARCODE CARD · CODE IMAGE')}</div><h2>${pick('给灵感留一盏灯', 'A light for your ideas')}</h2><pre><span class="code-purple">const</span> wish = {<br>  idea: 'starlight',<br>  keep: <span class="code-purple">true</span><br>};</pre><p>${pick('配色、留白与行号，按你的喜欢调整。', 'Choose your colors, spacing and line numbers.')}</p></article><article class="creation-card paper-card"><div class="card-kind">☾ ${pick('月光笺 · 手写纸笺', 'MOONLIGHT NOTE · PAPER NOTE')}</div><div class="paper-lines">${pick('把今天的小灵感，<br>写给明天的自己。<br>愿每一步都有星光。', 'Keep a little idea<br>for tomorrow.<br>Let it shine.')}</div><small>${pick('纸张与字体，留下你的表达。', 'Choose a font and paper. Make it yours.')}</small></article><div class="sample-ribbon">${pick('原创样例 · 排版示意，非字体效果承诺', 'Original samples · Layout illustration, not a font preview')}</div></div>` + features(pick(
    [['代码变图片', '星码卡预览与导出一致<br>配色、背景、行号可调'], ['文字变纸笺', '月光笺选择字体与纸张<br>在本机生成 PNG'], ['字体按需下载', '23 个字体选项可选择<br>下载后可离线使用']],
    [['Code into a card', 'Match your preview on export.<br>Adjust colors and line numbers.'], ['Words onto paper', 'Choose a font and paper.<br>Create a PNG locally.'], ['Fonts on demand', 'Choose from 23 font options.<br>Use downloaded fonts offline.']]
  )) + footer(pick('完整字体不随安装包提供；先预览，再下载喜欢的一款', 'Full fonts are not bundled. Preview them, then download the ones you like.'));
}

if (id === 'ai') {
  poster.innerHTML = top + heading(
    pick('MCP · CLI · SKILL · 由你授权', 'MCP · CLI · SKILL · YOUR PERMISSION'),
    pick('给 AI 一点资料，<br><em>范围由你决定。</em>', 'Give AI some context.<br><em>You set the scope.</em>'),
    pick('选择记录与字段，再授权连接；剪贴历史始终只读。', 'Choose clips and fields before you grant access.<br>Clipboard history stays read-only.')
  ) + `<div class="access-scene"><div class="access-head"><strong>${pick('AI 接入与自动化', 'AI access and automation')}</strong><span class="off-state">${pick('每次启动默认关闭', 'Off at every app launch')}</span></div><div class="grant-grid"><article class="grant"><small>01 / ${pick('选择资料', 'CHOOSE CONTEXT')}</small><h2>${pick('只开放你选中的片段', 'Only the clips you choose')}</h2><p>${pick('记录、字段、单次额度<br>逐项确认后再开放', 'Choose clips, fields and limits.<br>Review them before granting access.')}</p></article><article class="grant"><small>02 / ${pick('控制连接', 'CONTROL ACCESS')}</small><h2>${pick('有效期与撤销由你掌握', 'Set an expiry. Revoke anytime.')}</h2><p>${pick('连接只在本次运行有效<br>重启后需要重新授权', 'Grants last for this app session.<br>Restarting requires a new grant.')}</p></article></div><div class="grant-line"><b>✓</b><span>${pick('官方接口排除隐私、待扫描与图片记录', 'Private clips, unscanned clips and images are excluded.')}</span></div><p class="access-note">${pick('星伴动作与消息单独授权，也可不开放任何记录。', 'Grant StarPet actions and messages separately, without sharing any clips.')}</p></div>` + features(pick(
    [['连接现有 AI', 'MCP、CLI 与 Skill 接入<br>星笺不内置 AI 模型'], ['明确读取范围', '只读已选资料与字段<br>新增记录不自动授权'], ['随时收回权限', '关闭接入即撤销连接<br>已发出的内容无法撤回']],
    [['Connect your AI', 'Use MCP, CLI or a Skill.<br>No AI model is built in.'], ['Limit what it reads', 'Only selected clips and fields.<br>New clips are not auto-granted.'], ['Stay in control', 'Turn access off to revoke grants.<br>Sent content cannot be recalled.']]
  )) + footer(pick('保护范围为星笺官方接口；外部 AI 的后续处理由相应服务决定', 'Applies to Starclip’s official interface. External AI services control further use.'));
}

await document.fonts.ready;
await Promise.all([...document.images].map(image => image.decode()));
requestAnimationFrame(() => { document.documentElement.dataset.ready = 'true'; });
</script>
