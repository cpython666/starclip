<body><main id="poster"></main>
<script type="module">
import {createApp, h} from 'vue';
import StarPet from '/src/components/StarPet.vue';
const id=new URLSearchParams(location.search).get('id')||'overview';
const top='<div class="brand"><img src="/starclip.svg"><div><strong>星笺 Starclip</strong><small>本地剪贴板管理工具</small></div><span class="pill">开源 · 本地优先</span></div>';
const footer=(hint)=>`<footer class="footer"><div><strong>github.com/cpython666/starclip</strong><p>${hint}<br>桌面预览版 · 平台支持以项目说明为准</p></div><div class="mark">✦</div></footer>`;
const features=(list)=>'<section class="features">'+list.map((x,i)=>`<div><small>0${i+1}</small><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')+'</section>';
const poster=document.querySelector('#poster');poster.className=id;
if(id==='overview')poster.innerHTML=top+`<div class="eyebrow">本地剪贴板管理 · 开源桌面工具</div><h1>你的剪贴板，<br><em>不止记住上一次。</em></h1><p class="subtitle">复制过的文字、图片和代码，一搜就能再次复制。</p><div class="mock"><div class="mockbar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><b>星笺 · 剪贴板历史</b></div><div class="workspace"><div class="sidebar"><strong>剪贴板历史</strong><div class="chosen">全部记录</div><div>✦ 星标收藏</div><div>⌘ 星码集</div><div>工作资料</div><div>常用片段</div></div><div class="samples"><h2>刚刚复制的内容，都在这里</h2><div class="search">⌕ 搜索文字、标题或代码…</div><div class="samplegrid"><article class="sample"><label>文字 · 刚刚</label><h3>周五灵感讨论</h3><p>时间：下午 3 点<br>主题：一起做个小工具</p><span class="copy-chip">再次复制 ↗</span></article><article class="sample"><label>代码 · JAVASCRIPT</label><h3>常用代码片段</h3><code>const idea =<br>  'Hello, star!';</code><span class="copy-chip">✦ 星标收藏</span></article></div></div></div><div class="sample-ribbon">功能示意 · 原创样例</div></div>`+features([['找回复制历史','搜索后再次复制<br>少一次反复查找'],['收好重要内容','星标、分组与代码收藏<br>需要的内容永久保留'],['数据由你管理','本地保存，JSON 导出<br>无需账户，按需开启']])+footer('剪贴板历史 / 搜索 / 收藏 / JSON 导入导出');
if(id==='workflow')poster.innerHTML=top+`<div class="eyebrow">本地数据 · 自主备份与迁移</div><h1>剪贴板数据，<br><em>由你自己掌控。</em></h1><p class="subtitle">记录留在本机，导入、导出和存储位置由你决定。</p><div class="data-scene"><div class="local-data"><span class="data-icon">▤</span><div><small>存储在你的电脑</small><h2>我的剪贴板资料库</h2><p>文字 · 图片 · 代码 · 分组</p></div><b>本地保存</b></div><div class="data-route"><span>↓ 导出 JSON 备份</span><span>↑ 导入并合并记录</span></div><div class="backup-file"><span>{ }</span><div><strong>starclip-backup.json</strong><p>记录、分组与图片 · 开放的 JSON 格式</p></div></div><div class="data-options"><div><small>存到哪里</small><strong>选择数据目录</strong></div><div><small>保留一个完整时刻</small><strong>创建与恢复完整恢复点</strong></div></div><p class="data-note">普通历史 JSON 不含应用偏好；星伴成长可单独导出存档。</p></div>`+features([['随时备份','导出自己的记录<br>保存一份本地副本'],['继续使用','JSON 导入合并<br>已有记录保留'],['自主选择','查看并更换数据目录<br>恢复点保留完整状态']])+footer('无需账户 · 无云端同步 · 数据与备份为本机明文');
if(id==='companion'){
poster.innerHTML=top+`<div class="eyebrow">剪贴板管理工具里的原创星伴</div><h1>管理剪贴板，<br><em>也有星芽陪你。</em></h1><p class="subtitle">复制、收藏、创作之余，和桌面上的星芽打个招呼。</p><div class="pet-scene"><div class="pet-globe"></div><div class="pet" id="pet"></div><span class="pet-star">✧</span><span class="tag t1">今天也来打个招呼</span><span class="tag t2">换上喜欢的小装扮</span><span class="tag t3">摸摸、击掌、伸懒腰</span></div>`+features([['一点点成长','日常任务积累经验<br>每份小努力都有回应'],['穿出你的喜欢','眼镜、披风与小玩具<br>解锁成就和新装饰'],['按自己的节奏','成长可随时暂停<br>离线不掉级，无断签惩罚']])+footer('原创星芽 · 装扮展示 / 默认关闭，按需开启');
createApp({render:()=>h(StarPet,{size:500,animated:false,mood:'happy',equipment:{back:'night-cape',face:'moon-glasses',hand:'orbit-ball',charm:'heart-sticker'}})}).mount('#pet');
}
await document.fonts.ready;
requestAnimationFrame(()=>{document.documentElement.dataset.ready='true'});
</script>
</body></html>
